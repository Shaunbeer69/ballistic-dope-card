apply plugin: 'com.android.application'

android {

    // ======================================================
    // VERSIONING – read from package.json (auto)
    // ======================================================
    def pkgJsonFile = file("../../package.json")
    def pkgVersion = "0.0.1"

    if (pkgJsonFile.exists()) {
        def pkgJsonText = pkgJsonFile.getText("UTF-8")
        def m = (pkgJsonText =~ /"version"\s*:\s*"([^"]+)"/)
        if (m.find()) {
            pkgVersion = m.group(1)
        }
    }
    def parts = pkgVersion.tokenize(".")
    def major = (parts.size() > 0 ? parts[0].toInteger() : 0)
    def minor = (parts.size() > 1 ? parts[1].toInteger() : 0)
    def patch = (parts.size() > 2 ? parts[2].toInteger() : 0)

    def APP_VERSION_NAME = "${major}.${minor}.${patch}"
    def APP_VERSION_CODE = Math.max(1, (major * 10000) + (minor * 100) + patch)

    namespace "com.gunstuff.dopecard"
    compileSdk 35

    defaultConfig {
        applicationId "com.gunstuff.dopecard"

        minSdk 23
        targetSdk 35

        versionCode APP_VERSION_CODE
        versionName APP_VERSION_NAME

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.activity:activity:1.9.2"
    implementation "androidx.fragment:fragment:1.8.4"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.core:core-splashscreen:1.0.1"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

apply from: 'capacitor.build.gradle'
