<section class="space-y-4">
  <div class="rounded-3xl border border-white/10 bg-white/5 p-4 shadow-sm">
    <div class="text-sm font-semibold">Quick access</div>
    <div class="mt-3 grid grid-cols-2 gap-3">
      <a routerLink="/rifles" class="rounded-2xl border border-white/10 bg-slate-900/40 p-3 active:scale-[0.99]">
        <div class="text-base">⌁</div>
        <div class="mt-1 text-sm font-semibold">Rifles</div>
        <div class="text-xs text-slate-300">Profiles • loads</div>
      </a>

      <a routerLink="/venues" class="rounded-2xl border border-white/10 bg-slate-900/40 p-3 active:scale-[0.99]">
        <div class="text-base">⌖</div>
        <div class="mt-1 text-sm font-semibold">Venues</div>
        <div class="text-xs text-slate-300">Ranges • targets</div>
      </a>

      <a routerLink="/session" class="rounded-2xl border border-white/10 bg-slate-900/40 p-3 active:scale-[0.99]">
        <div class="text-base">◎</div>
        <div class="mt-1 text-sm font-semibold">Session</div>
        <div class="text-xs text-slate-300">Live dope</div>
      </a>

      <a routerLink="/history" class="rounded-2xl border border-white/10 bg-slate-900/40 p-3 active:scale-[0.99]">
        <div class="text-base">⟲</div>
        <div class="mt-1 text-sm font-semibold">History</div>
        <div class="text-xs text-slate-300">Logs • exports</div>
      </a>
    </div>
  </div>

  <div class="rounded-3xl border border-white/10 bg-white/5 p-4 shadow-sm">
    <div class="flex items-center justify-between">
      <div class="text-sm font-semibold">Tools</div>
      <a routerLink="/tools" class="text-xs text-slate-300 underline decoration-white/20 underline-offset-4">View all</a>
    </div>

    <div class="mt-3 grid grid-cols-1 gap-3">
      <a routerLink="/load-dev" class="rounded-2xl border border-white/10 bg-slate-900/40 p-3 active:scale-[0.99]">
        <div class="text-sm font-semibold">Load Development</div>
        <div class="text-xs text-slate-300">Track ladders and OCW</div>
      </a>
      <a routerLink="/tools/wind-effect" class="rounded-2xl border border-white/10 bg-slate-900/40 p-3 active:scale-[0.99]">
        <div class="text-sm font-semibold">Wind Effect Tool</div>
        <div class="text-xs text-slate-300">Estimate drift and corrections</div>
      </a>
    </div>
  </div>

  <div class="rounded-3xl border border-white/10 bg-white/5 p-4 shadow-sm">
    <div class="text-sm font-semibold">Reference library</div>
    <div class="mt-2 text-xs text-slate-300">Opens PDFs from app assets.</div>

    <div class="mt-3 space-y-2">
      <a
        *ngFor="let r of resources"
        [href]="r.href"
        target="_blank"
        rel="noopener"
        class="flex items-center justify-between rounded-2xl border border-white/10 bg-slate-900/40 px-3 py-2 active:scale-[0.99]"
      >
        <div class="min-w-0">
          <div class="truncate text-sm">{{ r.title }}</div>
        </div>
        <div class="ml-3 rounded-full border border-white/10 bg-white/5 px-2 py-0.5 text-[10px] text-slate-200">
          {{ r.tag || 'LINK' }}
        </div>
      </a>
    </div>
  </div>
</section>
