<section class="space-y-4">
  <div class="rounded-3xl border border-white/10 bg-white/5 p-4 shadow-sm">


    <div class="mt-3 space-y-2 text-[11px]">
      <div class="mt-2 grid grid-cols-2 gap-2 items-end">
        <div>
          <label class="block text-gray-300 mb-0.5 text-[10px]">Input</label>
          <input
            type="number"
            class="w-full bg-black border-2 border-orange-400/70 rounded px-2 py-1 text-[11px] outline-none focus:border-orange-300 focus:ring-2 focus:ring-orange-400/30"
            [(ngModel)]="converterInput"
            placeholder="Enter value…"
          />
        </div>

        <div>
          <label class="block text-gray-300 mb-0.5 text-[10px]">Output</label>
          <div class="w-full bg-black border-2 border-sky-400/70 rounded px-2 py-1 text-[11px] min-h-[28px] flex items-center">
            <span class="text-gray-100 font-semibold">
              {{ converterOutput === null ? '—' : (converterOutput | number: '1.3-3') }}
            </span>
          </div>
        </div>
      </div>

      <div class="mt-2 flex items-center justify-between rounded-xl border border-sky-400/30 bg-sky-500/10 px-3 py-2">
        <span class="text-[11px] text-sky-200 uppercase tracking-wide">Selected unit</span>
        <span class="text-[17px] font-bold text-white tracking-wide">{{ converterSelectedModeLabel }}</span>
      </div>

      <div class="space-y-1">
        <div *ngFor="let s of converterSections" class="rounded-lg border border-gray-700 bg-black/20 overflow-hidden">
          <button type="button" class="w-full flex items-center justify-between px-3 py-2 text-left" (click)="toggleConverterSection(s.id)">
            <span class="text-[11px] font-semibold text-gray-100">{{ s.label }}</span>
            <span class="text-gray-400 text-[11px]">{{ expandedConverterSection === s.id ? '▲' : '▼' }}</span>
          </button>

          <div *ngIf="expandedConverterSection === s.id" class="px-2 pb-2">
            <button
              *ngFor="let m of s.modes"
              type="button"
              class="w-full mt-1 px-3 py-2 rounded-lg border text-left text-[11px]"
              [ngClass]="converterMode === m.id ? 'bg-orange-500 border-orange-300 text-black' : 'bg-black/20 border-white/20 text-gray-100'"
              (click)="selectConverterMode(s.id, m.id)"
            >
              {{ m.label }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
