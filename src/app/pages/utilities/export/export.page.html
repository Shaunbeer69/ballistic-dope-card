<section class="space-y-4">
  <div class="rounded-3xl border border-white/10 bg-white/5 p-4 shadow-sm">
    <div class="flex items-center justify-between">
      <div class="min-w-0">
        <div class="text-sm font-semibold">Export File / PDF</div>
        <div class="text-xs text-slate-300">Share merge-safe data or generate a PDF snapshot</div>
      </div>
      <button type="button" class="rounded-2xl border border-white/10 bg-slate-900/40 px-3 py-2 text-xs text-slate-100 active:scale-[0.99]" (click)="back()">
        Back
      </button>
    </div>

    <div class="mt-4 space-y-3">
      <div class="rounded-2xl border border-white/10 bg-slate-900/30 p-3">
        <div class="text-xs font-semibold text-slate-200">Include</div>
        <div class="mt-2 flex items-center gap-4 text-xs text-slate-200">
          <label class="flex items-center gap-2">
            <input type="checkbox" [(ngModel)]="includeRifles" />
            Rifles
          </label>
          <label class="flex items-center gap-2">
            <input type="checkbox" [(ngModel)]="includeVenues" />
            Venues
          </label>
        </div>
      </div>

      <div class="rounded-2xl border border-white/10 bg-slate-900/30 p-3" *ngIf="includeRifles">
        <div class="text-xs font-semibold text-slate-200">Rifles options</div>
        <div class="mt-2 grid grid-cols-2 gap-2 text-xs text-slate-200">
          <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="allRifles" />All rifles</label>
          <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="rifleData" />Rifle data</label>
          <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="rifleLoadDev" />Load dev</label>
          <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="rifleSessions" />Sessions</label>
          <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="rifleShots" />Shots</label>
        </div>
        <div class="mt-2 text-[11px] text-slate-400" *ngIf="!allRifles">Selected IDs (comma-separated)</div>
        <input *ngIf="!allRifles" class="mt-1 w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs"
               [ngModel]="selectedRifleIds.join(',')"
               (ngModelChange)="onVenueIdsChange($event)" />
      </div>

      <div class="rounded-2xl border border-white/10 bg-slate-900/30 p-3" *ngIf="includeVenues">
        <div class="text-xs font-semibold text-slate-200">Venues options</div>
        <div class="mt-2 grid grid-cols-2 gap-2 text-xs text-slate-200">
          <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="allVenues" />All venues</label>
          <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="venueData" />Venue data</label>
          <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="venueSessions" />Sessions</label>
          <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="venueShots" />Shots</label>
        </div>
        <div class="mt-2 text-[11px] text-slate-400" *ngIf="!allVenues">Selected IDs (comma-separated)</div>
        <input *ngIf="!allVenues" class="mt-1 w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs"
               [ngModel]="selectedVenueIds.join(',')"
               (ngModelChange)="onVenueIdsChange($event)" />
      </div>

      <div class="grid grid-cols-1 gap-3">
        <button type="button" class="rounded-2xl border border-white/10 bg-slate-900/40 px-4 py-3 text-left active:scale-[0.99]"
                (click)="exportJson()" [disabled]="busy">
          <div class="text-sm font-semibold">Export JSON (merge-safe)</div>
          <div class="text-xs text-slate-300 mt-1">Creates a share file for another user.</div>
        </button>

        <button type="button" class="rounded-2xl border border-white/10 bg-slate-900/40 px-4 py-3 text-left active:scale-[0.99]"
                (click)="exportPdf()" [disabled]="busy">
          <div class="text-sm font-semibold">Share PDF</div>
          <div class="text-xs text-slate-300 mt-1">Creates a printable PDF snapshot of the current selection.</div>
        </button>

        <div *ngIf="busy" class="text-xs text-slate-300">Working…</div>
      </div>
    </div>
  </div>
</section>
