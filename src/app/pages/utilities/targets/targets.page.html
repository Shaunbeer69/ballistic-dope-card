<section class="space-y-4">
  <div class="rounded-3xl border border-white/10 bg-white/5 p-4 shadow-sm">
    <div class="flex items-center justify-between">
      <div class="min-w-0">
        <div class="text-sm font-semibold">Target downloads</div>
        <div class="text-xs text-slate-300">Download &amp; print standard targets</div>
      </div>
      <button type="button" class="rounded-2xl border border-white/10 bg-slate-900/40 px-3 py-2 text-xs text-slate-100 active:scale-[0.99]" (click)="back()">
        Back
      </button>
    </div>

    <p class="mt-3 text-slate-300 text-xs">
      Download and print standard target for load development and zeroing.
    </p>

    <div class="mt-3 space-y-2">
      <button
        *ngFor="let t of TARGETS"
        class="w-full px-3 py-3 rounded-2xl bg-slate-900/40 border border-white/10 hover:bg-white/10 transition text-left active:scale-[0.99]"
        (click)="downloadTarget(t.id)"
      >
        <div class="text-sm font-semibold">{{ t.label }}</div>
        <div class="text-xs text-slate-300">{{ t.file }}</div>
      </button>
    </div>
  </div>
</section>
