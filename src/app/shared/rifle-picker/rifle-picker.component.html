<button
  type="button"
  class="w-full bg-black/40 border border-amber-400 rounded-2xl px-2 py-2  text-xs text-gray-100 ring-1 ring-amber-400/70 shadow-md shadow-amber-400/40 flex items-center justify-between"
  (click)="openRiflePicker()"
>
  <span class="truncate">{{ selectedRiflePickerLabel() }}</span>
  <span class="text-[10px] text-amber-200/80">▼</span>
</button>

<!-- Rifle picker modal (same style as Rifles tab / Load Dev) -->
<div
  *ngIf="riflePickerOpen"
  class="fixed inset-0 z-[9999] bg-black/80 flex items-start justify-center pt-[72px] px-3 pb-3"
  (click)="closeRiflePicker()"
>
  <div
    class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-950 p-3"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start justify-between gap-2">
      <div class="text-[12px] font-semibold text-slate-100">Select rifle</div>

      <div class="flex gap-2">
        <button
          type="button"
          class="px-2 py-2 rounded-xl bg-slate-800 text-slate-100 text-[10px]"
          (click)="clearRifleFromPicker()"
        >
          Clear
        </button>

        <button
          type="button"
          class="px-2 py-2 rounded-xl bg-slate-800 text-slate-100 text-[10px]"
          (click)="closeRiflePicker()"
        >
          Close
        </button>
      </div>
    </div>

    <div class="mt-2">
      <input
        type="text"
        class="w-full px-2 py-2  rounded bg-slate-900 border border-slate-700 text-[11px] text-white outline-none"
        placeholder="Search rifles…"
        [(ngModel)]="riflePickerSearch"
        (ngModelChange)="onRiflePickerSearchChange($event)"
        name="riflePickerSearch"
      />
    </div>

    <div
      class="mt-2 rounded-xl border border-slate-700 bg-slate-900 p-2 max-h-[45vh] overflow-y-auto"
    >
      <div *ngIf="riflePickerFiltered.length === 0" class="text-[10px] text-slate-400 px-1 py-2">
        No matches
      </div>

      <button
        *ngFor="let r of riflePickerFiltered"
        type="button"
        class="w-full text-left px-2 py-2  rounded-xl hover:bg-slate-800 flex items-start gap-2"
        (click)="selectRifleFromPicker(r)"
      >
        <!-- LEFT checkbox aligned to rifle name line -->
        <input
          type="checkbox"
          class="h-4 w-4 shrink-0 mt-[2px]"
          [checked]="r.id === selectedRifleId"
          (click)="$event.stopPropagation(); selectRifleFromPicker(r)"
        />

        <div class="min-w-0 flex-1">
          <div class="text-[11px] text-white font-semibold truncate leading-tight">
            {{ r.name || '-' }}
          </div>
          <div class="text-[10px] text-slate-400 truncate">
            {{ r.caliber || '-' }}
          </div>
        </div>
      </button>
    </div>
  </div>
</div>
