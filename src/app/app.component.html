<div class="min-h-screen bg-slate-950 text-slate-50">
  <!-- Top App Bar -->
  <header class="sticky top-0 z-20 border-b border-white/10 bg-slate-950/75 backdrop-blur">
    <div class="mx-auto flex max-w-md items-center gap-3 px-4 py-3">
      <button
        *ngIf="showBack"
        type="button"
        (click)="back()"
        class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-white/10 bg-white/5 active:scale-[0.98]"
        aria-label="Back"
      >
        <img alt="back" src="/assets/back.svg"/>
      </button>

      <div class="min-w-0 flex-1">
        <div class="truncate text-sm font-semibold tracking-tight">{{ title }}</div>
        <div class="text-[11px] text-slate-300">  {{ appTitle }} • {{ appSubtitle }} •  v{{ appVersion }}</div>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="mx-auto max-w-md px-4 pt-4 pb-[calc(5rem+env(safe-area-inset-bottom))]">
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Navigation -->
  <nav
    class="fixed inset-x-0 bottom-0 z-30 border-t border-white/10 bg-slate-950/80 backdrop-blur"
    style="padding-bottom: env(safe-area-inset-bottom);"
    aria-label="Primary"
  >
    <div class="mx-auto grid max-w-md grid-cols-5 gap-1 px-2 py-2  text-[11px]">


      <a
        routerLink="/"
        routerLinkActive="bg-white/10 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex flex-col items-center justify-center gap-1 rounded-xl px-2 py-2  text-slate-300 active:scale-[0.98]"
        aria-label="home"
      >
        <span class="text-base leading-none">⌂</span>
        <span>Home</span>
      </a>
      <a
        routerLink="/venues"
        routerLinkActive="bg-white/10 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex flex-col items-center justify-center gap-1 rounded-xl px-2 py-2  text-slate-300 active:scale-[0.98]"
        aria-label="venues"
      >
        <span class="text-base leading-none">⚲</span>
        <span>Venues</span>
      </a>




      <a
        routerLink="/session"
        routerLinkActive="bg-white/10 text-white"
        class="flex flex-col items-center justify-center gap-1 rounded-xl px-2 py-2  text-slate-300 active:scale-[0.98]"
        aria-label="Session"
      >
        <span class="text-base leading-none">◎</span>
        <span>Session</span>
      </a>

      <a
        routerLink="/rifles"
        routerLinkActive="bg-white/10 text-white"
        class="flex flex-col items-center justify-center gap-1 rounded-xl px-2 py-2  text-slate-300 active:scale-[0.98]"
        aria-label="Rifles"
      >
        <span class="text-base leading-none">⌁</span>
        <span>Rifles</span>
      </a>

      <a
        routerLink="/tools"
        routerLinkActive="bg-white/10 text-white"
        class="flex flex-col items-center justify-center gap-1 rounded-xl px-2 py-2  text-slate-300 active:scale-[0.98]"
        aria-label="Tools"
      >
        <span class="text-base leading-none">⚙</span>
        <span>Tools</span>
      </a>
    </div>
  </nav>
</div>
