<div
  class="w-full h-full flex flex-col gap-3 text-gray-100 text-[11px] overflow-hidden pt-2 pb-2 items-center"
>
  <!-- Choose rifle -->
  <div class="bg-gray-900/70 border border-gray-700 rounded-xl p-2">
    <select
      class="w-full bg-black border border-gray-700 rounded-lg px-2 py-1 text-[10px]"
      [(ngModel)]="selectedRifleId"
      (ngModelChange)="onRifleChanged($event)"
    >
      <option [ngValue]="null">Choose rifle</option>
      <option *ngFor="let r of rifles" [ngValue]="r.id ?? r.rifleId">
        {{ r.name || r.label || 'Rifle ' + (r.id ?? r.rifleId) }}
      </option>
    </select>
  </div>

  <!-- Rifle / wind from -->
  <div class="bg-gray-900/70 border border-gray-700 rounded-xl p-2">
    <div class="grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)_112px] gap-1">
      <div>
        <div class="text-[9px] text-gray-400">Range (m)</div>
        <input
          type="number"
          [(ngModel)]="rangeMeters"
          (ngModelChange)="onRangeMetersChange($event)"
          class="w-full bg-black border border-gray-700 rounded-lg px-2 py-0.5 text-[10px]"
        />
      </div>

      <div>
        <div class="text-[9px] text-gray-400">MV (fps)</div>
        <input
          type="number"
          [(ngModel)]="muzzleVelocityFps"
          (ngModelChange)="updatePoiFromDrift()"
          class="w-full bg-black border border-gray-700 rounded-lg px-2 py-0.5 text-[10px]"
        />
      </div>

      <div>
        <div class="text-[9px] text-gray-400">Wind from</div>
        <div
          class="w-full bg-black border border-gray-700 rounded-lg px-2 py-0.5 text-[10px] text-center font-semibold"
        >
          {{ windFromClock }}
        </div>
      </div>
    </div>
  </div>

  <!-- Wind speed -->
  <!-- Wind speed -->
  <div class="bg-gray-900/70 border border-gray-700 rounded-xl p-2">
    <div class="flex items-center gap-2">
      <span class="text-[10px] text-gray-300 whitespace-nowrap"> Wind speed </span>

      <input
        type="number"
        [ngModel]="windSpeedInput"
        (ngModelChange)="onWindSpeedInputChange($event)"
        class="w-20 bg-black border border-gray-700 rounded-lg px-2 py-0.5 text-[11px]"
      />

      <select
        [ngModel]="windUnit"
        (ngModelChange)="onWindUnitChange($event)"
        class="w-20 bg-black border border-gray-700 rounded-lg px-1 py-0.5 text-[10px]"
      >
        <option value="mph">mph</option>
        <option value="kmh">km/h</option>
        <option value="mps">m/s</option>
      </select>
    </div>
  </div>

  <!-- Wind dial -->
  <div
    #circleArea
    class="relative mx-auto aspect-square flex-none w-full max-h-[42vh] md:max-h-[40vh] select-none touch-none"
    (pointerdown)="startDrag($event)"
    (pointermove)="onDrag($event)"
    (pointerup)="endDrag($event)"
    (pointercancel)="endDrag($event)"
    (pointerleave)="endDrag($event)"
  >
    <svg viewBox="0 0 100 100" class="w-full h-full">
      <!-- Outer & inner rings -->
      <circle
        cx="50"
        cy="50"
        r="40"
        class="fill-[#020617] stroke-gray-600"
        stroke-width="1.5"
      ></circle>
      <circle
        cx="50"
        cy="50"
        r="22"
        class="fill-[#020617] stroke-gray-700"
        stroke-width="0.8"
      ></circle>

      <!-- Crosshair -->
      <line x1="50" y1="18" x2="50" y2="82" class="stroke-gray-700" stroke-width="0.6"></line>
      <line x1="18" y1="50" x2="82" y2="50" class="stroke-gray-700" stroke-width="0.6"></line>

      <!-- Hour ticks + labels -->
      <ng-container *ngFor="let h of hours">
        <line
          [attr.x1]="h.tickX1"
          [attr.y1]="h.tickY1"
          [attr.x2]="h.tickX2"
          [attr.y2]="h.tickY2"
          class="stroke-gray-500"
          stroke-width="0.6"
        ></line>

        <text
          [attr.x]="h.labelX"
          [attr.y]="h.labelY"
          text-anchor="middle"
          alignment-baseline="middle"
          class="fill-gray-300"
          font-size="6"
        >
          {{ h.hour }}
        </text>
      </ng-container>

      <!-- ORANGE arrow – tail on outer ring, tip toward center -->
      <g [attr.transform]="'rotate(' + arrowAngleDeg + ' 50 50)'">
        <line
          x1="50"
          y1="16"
          x2="50"
          y2="36"
          class="stroke-orange-400"
          stroke-width="2.8"
          stroke-linecap="round"
        ></line>

        <polygon points="50,40 46,34 54,34" class="fill-orange-400"></polygon>
      </g>

      <!-- POI dot (red) – position driven by drift -->
      <circle [attr.cx]="poiX" [attr.cy]="poiY" r="1.15" class="fill-red-500"></circle>
    </svg>
  </div>

  <!-- Drift result cards -->
  <div class="w-full max-w-[520px] grid grid-cols-2 gap-2 mt-1 shrink-0 px-2 mb-2">
    <!-- Mil + cm -->
    <div class="bg-gray-900/90 border border-emerald-500/70 rounded-xl px-2 py-1">
      <div class="flex items-center text-[9px] font-semibold">
        <span class="flex-1 text-emerald-400"> Drift (mil) </span>
        <span class="flex-1 text-emerald-300 text-right"> Drift (cm) </span>
      </div>
      <div class="h-px bg-gray-800 my-0.5"></div>
      <div class="flex items-baseline text-[12px] text-gray-50 font-bold">
        <span class="flex-1">
          {{ milDrift | number : '1.2-2' }}
        </span>
        <span class="w-px h-4 bg-gray-700 mx-1"></span>
        <span class="flex-1 text-right">
          {{ driftCm | number : '1.1-1' }}
        </span>
      </div>
    </div>

    <!-- MOA + inch -->
    <div class="bg-gray-900/90 border border-sky-500/70 rounded-xl px-2 py-1">
      <div class="flex items-center text-[9px] font-semibold">
        <span class="flex-1 text-sky-400"> Drift (MOA) </span>
        <span class="flex-1 text-sky-300 text-right"> Drift (inch) </span>
      </div>
      <div class="h-px bg-gray-800 my-0.5"></div>
      <div class="flex items-baseline text-[12px] text-gray-50 font-bold">
        <span class="flex-1">
          {{ moaDrift | number : '1.2-2' }}
        </span>
        <span class="w-px h-4 bg-gray-700 mx-1"></span>
        <span class="flex-1 text-right">
          {{ driftInches | number : '1.2-2' }}
        </span>
      </div>
    </div>
  </div>
</div>
